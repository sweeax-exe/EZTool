# Builds EZTool and publishes a GitHub release whenever a version tag (e.g. v1.2.0) is pushed.
# Installed copies find the release via the GitHub API and offer it as an update.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version from tag
        shell: pwsh
        run: echo "VERSION=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Build self-contained single-file EXE
        shell: pwsh
        run: >
          dotnet publish src/EZTool/EZTool.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: Create package and checksum
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md publish/
          Compress-Archive -Path publish/* -DestinationPath EZTool-win-x64.zip
          $hash = (Get-FileHash EZTool-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  EZTool-win-x64.zip" | Out-File SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          EZTool-win-x64.zip SHA256SUMS.txt publish/EZTool.exe
          --title "EZTool ${{ env.VERSION }}"
          --generate-notes
