# Baut EZTool und veröffentlicht ein GitHub-Release, sobald ein Versions-Tag (z. B. v1.0.1) gepusht wird.
# Die App findet das Release über die GitHub-API und bietet es als Update an.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version aus dem Tag lesen
        shell: pwsh
        run: echo "VERSION=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Als eigenständige Einzeldatei bauen
        shell: pwsh
        run: >
          dotnet publish src/EZTool/EZTool.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: Paket und Prüfsumme erstellen
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md publish/
          Compress-Archive -Path publish/* -DestinationPath EZTool-win-x64.zip
          $hash = (Get-FileHash EZTool-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  EZTool-win-x64.zip" | Out-File SHA256SUMS.txt -Encoding ascii

      - name: GitHub-Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          EZTool-win-x64.zip SHA256SUMS.txt publish/EZTool.exe
          --title "EZTool ${{ env.VERSION }}"
          --generate-notes
